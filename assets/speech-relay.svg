<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-label="speech-relay pipeline: mic over WebRTC to VAD, ASR, MT, TTS, then audio out with fan-out">
  <style>
    .title { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #00F707; }
    .box { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }
    .sub { font: 400 10px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .lbl { font: 500 10px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .metric { font: 600 11px 'Segoe UI', Ubuntu, sans-serif; fill: #00F707; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="167" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text class="title" x="20" y="26">speech-relay · live EN→HI over WebRTC</text>
  <text class="metric" x="860" y="26" text-anchor="end">2505 ms mean e2e · −23.6% with VAD</text>

  <!-- Mic -->
  <rect x="20" y="52" width="92" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="box" x="66" y="76" text-anchor="middle">Mic</text>
  <text class="sub" x="66" y="92" text-anchor="middle">browser</text>

  <path d="M112 80 H142" stroke="#00F707" stroke-width="1.5" fill="none"/>
  <polygon points="142,76 152,80 142,84" fill="#00F707"/>
  <text class="lbl" x="132" y="70" text-anchor="middle">WebRTC</text>

  <!-- VAD -->
  <rect x="156" y="52" width="92" height="56" rx="8" fill="#161b22" stroke="#00F707"/>
  <text class="box" x="202" y="76" text-anchor="middle">VAD</text>
  <text class="sub" x="202" y="92" text-anchor="middle">Silero</text>

  <path d="M248 80 H278" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <polygon points="278,76 288,80 278,84" fill="#8b949e"/>

  <!-- ASR -->
  <rect x="292" y="52" width="110" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="box" x="347" y="76" text-anchor="middle">ASR</text>
  <text class="sub" x="347" y="92" text-anchor="middle">faster-whisper</text>

  <path d="M402 80 H432" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <polygon points="432,76 442,80 432,84" fill="#8b949e"/>

  <!-- MT -->
  <rect x="446" y="52" width="110" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="box" x="501" y="76" text-anchor="middle">MT</text>
  <text class="sub" x="501" y="92" text-anchor="middle">IndicTrans2</text>

  <path d="M556 80 H586" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <polygon points="586,76 596,80 586,84" fill="#8b949e"/>

  <!-- TTS -->
  <rect x="600" y="52" width="100" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="box" x="650" y="76" text-anchor="middle">TTS</text>
  <text class="sub" x="650" y="92" text-anchor="middle">Coqui / edge</text>

  <path d="M700 80 H730" stroke="#00F707" stroke-width="1.5" fill="none"/>
  <polygon points="730,76 740,80 730,84" fill="#00F707"/>
  <text class="lbl" x="720" y="70" text-anchor="middle">audio</text>

  <!-- Out -->
  <rect x="744" y="52" width="116" height="56" rx="8" fill="#161b22" stroke="#00F707"/>
  <text class="box" x="802" y="76" text-anchor="middle">Listener</text>
  <text class="sub" x="802" y="92" text-anchor="middle">N targets</text>

  <!-- fan-out note -->
  <path d="M347 108 V128 H650 V108" stroke="#30363d" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <text class="lbl" x="500" y="146" text-anchor="middle">shared ASR stream · independent MT + TTS per listener · 1.56× parallel efficiency at N=2</text>
  <text class="sub" x="20" y="158">ONNX fp16/int8 up to 11.3% faster · WER/CER harness on FLEURS / fixtures</text>
</svg>
